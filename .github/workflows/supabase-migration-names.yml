name: Generate Supabase Migration Names

on:
  push:
    branches:
      - reconstruction/supabase-hybrid
    paths:
      - .github/workflows/supabase-migration-names.yml

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2
      - name: Show CLI version
        run: supabase --version
      - name: Generate migration names
        run: |
          supabase migration new recover_uncertainty_and_market_policy
          supabase migration new recover_price_sensitivity
          supabase migration new recover_verification_and_weather
          supabase migration new recover_sharp_disagreement
          supabase migration new recover_team_and_prop_fusion
          supabase migration new recover_player_prop_clv
          supabase migration new recover_parlay_correlation_and_timing
          supabase migration new recover_model_governance_and_attribution
          supabase migration new recover_pipeline_health
          supabase migration new recover_posthistory_security_and_cron
          echo "GENERATED_MIGRATIONS"
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort | tail -n 10
