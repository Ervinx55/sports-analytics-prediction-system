name: Supabase Isolated Rebuild

on:
  push:
    branches:
      - reconstruction/supabase-hybrid
    paths:
      - "supabase/**"
      - "scripts/supabase/**"
      - "tests/supabase/**"
      - ".github/workflows/supabase-rebuild.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Discover CLI commands
        run: |
          supabase --version
          supabase start --help >/tmp/supabase-start-help.txt
          supabase db reset --help >/tmp/supabase-db-reset-help.txt

      - name: Start isolated Supabase
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset

      - name: Run isolated rebuild smoke checks
        env:
          PYTHONPATH: .
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: python scripts/supabase/smoke_rebuild.py

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup || true
