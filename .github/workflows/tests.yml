name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scan Supabase reconstruction source for secrets
        run: python scripts/supabase/validate_reconstruction.py --check-secrets .

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
