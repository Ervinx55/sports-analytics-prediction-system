name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install --ignore-scripts

      - name: Scan Supabase reconstruction source for secrets
        run: python scripts/supabase/validate_reconstruction.py --check-secrets .

      - name: Run API regression tests
        run: node --test tests/node/*.test.mjs

      - name: Run Python tests
        env:
          PYTHONPATH: .
        run: pytest -q
