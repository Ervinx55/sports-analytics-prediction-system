name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r sharp-service/requirements.txt

      - name: Scan Supabase reconstruction source for secrets
        run: python scripts/supabase/validate_reconstruction.py --check-secrets .

      - name: Run API regression tests
        run: node --test tests/node/*.test.mjs

      - name: Install journal SQL regression dependencies
        run: npm ci --prefix tests/sql --ignore-scripts --no-audit --no-fund

      - name: Verify journal integrity against PostgreSQL
        run: npm --prefix tests/sql test

      - name: Run Python tests
        env:
          PYTHONPATH: .
        run: pytest -q


      - name: Install browser regression dependencies
        run: |
          npm install --prefix tests/browser --ignore-scripts --no-audit --no-fund
          cd tests/browser && npx playwright install --with-deps chromium

      - name: Verify sharp-book research UI
        run: node tests/browser/sharp-books.mjs

      - name: Verify team scoring context on desktop and mobile
        run: node tests/browser/team-scoring.mjs

      - name: Verify shared card disclosures and mobile layout
        run: node tests/browser/deep-dives.mjs

      - name: Verify NBA statistical scenarios and mobile layout
        run: node tests/browser/nba-scenarios.mjs
