name: TensorFlow Shadow Model

on:
  push:
    branches:
      - "master"
    paths:
      - "ml/**"
      - "data/ml/**"
      - "requirements-ml.txt"
      - ".github/workflows/ml-shadow.yml"
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  train-player-prop-shadow:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ml.txt

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt

      - name: Refresh labeled snapshot from Supabase via GitHub OIDC
        env:
          SUPABASE_URL: "https://yeoxroijaptomomshdii.supabase.co"
          SUPABASE_ML_EXPORT_AUDIENCE: "edge-lab-supabase-ml-export"
        run: |
          python ml/export_player_prop_snapshot.py \
            --output data/ml/player_prop_training_snapshot.csv
          echo "ML_SNAPSHOT_SOURCE=supabase_live_oidc" >> "$GITHUB_ENV"

      - name: Run expanding-window walk-forward evaluation
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
          PYTHONHASHSEED: "42"
        run: |
          python ml/walk_forward_player_prop.py \
            --data data/ml/player_prop_training_snapshot.csv \
            --output-dir artifacts/player_prop_tf_shadow/walk_forward

      - name: Train TensorFlow challenger
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
          PYTHONHASHSEED: "42"
        run: |
          python ml/train_player_prop_tensorflow.py \
            --data data/ml/player_prop_training_snapshot.csv \
            --output-dir artifacts/player_prop_tf_shadow \
            --walk-forward-report artifacts/player_prop_tf_shadow/walk_forward/metrics.json

      - name: Publish model evaluation summary
        if: always()
        run: |
          echo "Snapshot source: **${ML_SNAPSHOT_SOURCE:-unknown}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/player_prop_tf_shadow/walk_forward/summary.md ]; then
            cat artifacts/player_prop_tf_shadow/walk_forward/summary.md >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/player_prop_tf_shadow/summary.md ]; then
            cat artifacts/player_prop_tf_shadow/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload shadow model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: player-prop-tensorflow-shadow
          path: |
            artifacts/player_prop_tf_shadow/
            data/ml/player_prop_training_snapshot.csv
          if-no-files-found: error
          retention-days: 30
