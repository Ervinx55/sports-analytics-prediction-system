name: Edge Lab Prop Calibration Tests
on:
  push:
    branches:
      - feature/private-accounts
    paths:
      - 'sharp-service/scripts/calibrate-prop-probabilities.mjs'
      - 'sharp-service/test/calibrate-prop-probabilities.test.mjs'
      - '.github/workflows/edge-lab-calibration.yml'
  workflow_dispatch:
jobs:
  calibration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: sharp-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test chronological calibration and fail-closed gates
        run: node --test test/calibrate-prop-probabilities.test.mjs
